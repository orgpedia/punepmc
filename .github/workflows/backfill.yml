name: backfill

on:
  schedule:
    - cron: "0 4 * * 0"   # weekly full re-crawl, Sunday (09:30 IST)
  # No wayback here: SPN2 rejects GitHub's IPs (HTTP 429), so run `make backfill WHAT=wayback` locally.
  workflow_dispatch:
    inputs:
      what:
        description: "What to backfill"
        type: choice
        options: [archive, crawl]
        default: archive
      limit:
        description: "Max items this run (empty = no limit; keep runs under ~5h)"
        type: string
        default: "500"

# daily and backfill share one group so no two runs write the state files at the same time
concurrency:
  group: punepmc-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_WHAT: ${{ inputs.what }}
      INPUT_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: make install

      - name: Backfill
        run: |
          if [ "$EVENT" = "schedule" ]; then
            WHAT=crawl; LIMIT=
          else
            WHAT="$INPUT_WHAT"; LIMIT="$INPUT_LIMIT"
          fi
          case "$WHAT" in archive|crawl) ;; *) echo "bad what: $WHAT"; exit 1 ;; esac
          case "$LIMIT" in ""|*[!0-9]*) LIMIT= ;; esac
          echo "WHAT=$WHAT" >> "$GITHUB_ENV"
          make backfill WHAT="$WHAT" LIMIT="$LIMIT"

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/documents
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "circulars: backfill ${WHAT:-} $(date -u +%F)"
          git pull --rebase -q
          git push -q

      - name: Upload logs and raw API responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ github.run_id }}
          path: |
            input/logs/*.log
            LFS/punePMC/api/
          retention-days: 30
          if-no-files-found: ignore
